name: 플레이 확인

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  play-check:
    name: 브라우저 기본 동작
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 시험 파일 확인
        id: script
        shell: bash
        run: |
          if [[ -f tools/play-check.js ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "### 자동 플레이 확인 대기 중" >> "$GITHUB_STEP_SUMMARY"
            echo "C2의 tools/play-check.js가 들어오면 브라우저 시험을 실행합니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.script.outputs.available == 'true'
        with:
          node-version: '24'

      - name: 시험 환경 설치
        if: steps.script.outputs.available == 'true'
        working-directory: tools
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: 기본 플레이와 1인칭 자리 확인
        id: play
        if: steps.script.outputs.available == 'true'
        env:
          SP_THREE: ${{ github.workspace }}/tools/node_modules/three/build/three.min.js
        run: |
          available="$(node tools/play-check.js --list)"
          tests="panel,walk,aerial"
          while read -r scenario _; do
            case "$scenario" in
              seats|spring|rain) tests="$tests,$scenario" ;;
            esac
          done <<< "$available"
          node tools/play-check.js "$tests" --gl=swiftshader --offline

      - name: 실패한 실행의 화면 보관
        if: failure() && steps.play.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: play-check-screenshots
          path: tools/out/*.png
          if-no-files-found: ignore
          retention-days: 3
